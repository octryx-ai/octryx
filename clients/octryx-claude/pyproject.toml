# The installable octryx-claude package. The platform builds the served wheel from this file and the
# package sources (backend/app/services/octryx_client/artifact.py); the installers put it into its own venv.
[build-system]
# 77: the first setuptools that reads project.license as an SPDX expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octryx-claude"
dynamic = ["version"]
description = "Run Claude Code through Octryx (governed agent gateway client)"
requires-python = ">=3.11"
license = "Apache-2.0"
# Pinned to the version the platform tests against (backend/uv.lock).
# cryptography, websockets and the Claude Agent SDK: the device key, channel and job driver of remote device
# sessions. The SDK drives the user's own `claude` (cli_path); its bundled CLI is not used.
# ast-grep-cli, playwright and ruff: the tools the launcher brings (octryx_claude/tools_data.py pins the same versions;
# everything the platform needs comes with the launcher).
dependencies = ["httpx==0.28.1", "cryptography==50.0.1", "websockets==16.0", "claude-agent-sdk>=0.1.0",
                "ast-grep-cli==0.51.0", "playwright==1.64.1", "ruff==0.15.7"]

[project.optional-dependencies]
# The Octryx pet (`octryx-claude pet`, a tray icon): pystray brings pyobjc on macOS; Pillow >= 10.1 for sized fonts.
pet = ["pystray==0.19.5", "Pillow>=10.1"]

[project.scripts]
octryx-claude = "octryx_claude.entry:main"
# The short name: `octryx` runs exactly the same command.
octryx = "octryx_claude.entry:main"

[tool.setuptools]
packages = ["octryx_claude"]

[tool.setuptools.package-data]
octryx_claude = ["*.json"]  # data the launcher reads (os_junk.json); the platform's served wheel takes them too

[tool.setuptools.dynamic]
version = { attr = "octryx_claude.__version__" }
