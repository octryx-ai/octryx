# Octryx AI on one machine: `docker compose up -d` (see https://octryx.ai/docs/install/docker).
#
# Default: PostgreSQL with pgvector, an S3-compatible object store for Knowledge, the schema
# migration and the API (which also serves the web UI) on http://localhost:${OCTRYX_PORT:-8000}.
# .env holds only the model access. The deployment secrets (JWT, encryption key, database
# password) are generated on the first start into the `secrets` volume and never leave it.
#
# The demo is a separate file on top of this one (docker-compose.demo.yml, deployment/demo/README.md):
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
# Without it nothing of the demo runs and nothing is relaxed for it.
#
# Optional, through profiles (e.g. `docker compose --profile ollama up -d`, or COMPOSE_PROFILES in .env):
#   ollama             a local Ollama server (http://ollama:11434), configured in Admin › Models
#   code-intelligence  the code indexer
#   llama-cpp          a llama.cpp server for one local GGUF model
# Project name, also the prefix of the volumes. An install made under an earlier name keeps its data with
# COMPOSE_PROJECT_NAME=<that name> and OCTRYX_POSTGRES_DB=<its database name> in .env.
name: octryx

x-image: &image
  image: ${OCTRYX_IMAGE:-octryx-api:local}
  build:
    context: .
    dockerfile: Dockerfile
    target: api

# Every process of the platform reads the generated secrets the same way.
x-with-secrets: &with-secrets
  entrypoint:
    - sh
    - -c
    - |
      set -eu
      export JWT_SECRET="$$(cat /run/octryx-secrets/jwt_secret)"
      export ENCRYPTION_KEY="$$(cat /run/octryx-secrets/encryption_key)"
      export RUNNER_JOIN_SECRET="$$(cat /run/octryx-runner/runner-join 2>/dev/null || true)"
      export DATABASE_URL="postgresql+asyncpg://octryx:$$(cat /run/octryx-secrets/postgres_password)@postgres:5432/${OCTRYX_POSTGRES_DB:-octryx}"
      exec "$$@"
    - with-secrets

x-environment: &environment
  DEBUG: "false"
  OCTRYX_RUNTIME_PROFILE: staging
  # The browser reaches the platform on this origin only. Auth cookies are Secure, which
  # Chrome, Edge and Firefox accept on http://localhost.
  OCTRYX_PUBLIC_ORIGIN: http://localhost:${OCTRYX_PORT:-8000}
  CORS_ALLOWED_ORIGINS: http://localhost:${OCTRYX_PORT:-8000},http://127.0.0.1:${OCTRYX_PORT:-8000}
  FORCE_SECURE_AUTH_COOKIES: "true"
  AUTH_COOKIE_SAMESITE: lax
  # The container runtime every server runner must run on (RUNNER_RUNTIME=runsc for gVisor, docker/runner/README.md).
  RUNNER_RUNTIME: ${RUNNER_RUNTIME:-}
  # Unattended installs only. Empty: the first start logs a setup code (https://octryx.ai/docs/install/docker#steps).
  ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
  OCTRYX_SESSION_WORKSPACE_BASE_DIR: /app/data/session-workspaces
  # The one model access (services/control_plane/env_model_access.py), read on the first start only.
  LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER in .env (anthropic, openai, bedrock or openrouter), see https://octryx.ai/docs/install/docker}
  AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:?Set AGENT_DEFAULT_MODEL in .env, see https://octryx.ai/docs/install/docker}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-}
  AWS_REGION: ${AWS_REGION:-eu-central-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_EC2_METADATA_DISABLED: "true"
  # Knowledge: evidence index in PostgreSQL, originals in the object store on the pod loopback.
  # No embedding model is installed, so search is lexical (vector search reports needs_configuration).
  OCTRYX_KNOWLEDGE_OBJECT_ENDPOINT_URL: http://127.0.0.1:8333
  OCTRYX_KNOWLEDGE_OBJECT_BUCKET: octryx-knowledge
  OCTRYX_KNOWLEDGE_OBJECT_REGION: us-east-1
  # The object store's own credentials profile, so it never uses the Bedrock AWS_* keys above.
  OCTRYX_KNOWLEDGE_OBJECT_AWS_PROFILE: octryx-knowledge-object
  AWS_SHARED_CREDENTIALS_FILE: /run/octryx-object-store/credentials
  HF_HUB_OFFLINE: "1"
  OCTRYX_BUNDLED_LITELLM_URL: http://127.0.0.1:4000
  OCTRYX_BUNDLED_LITELLM_MASTER_KEY_FILE: /run/octryx-secrets/litellm_master_key

configs:
  litellm-config:
    # No UI, no message, spend or error logging and no callbacks: prompts and answers never land in LiteLLM's
    # database.
    content: |
      litellm_settings:
        turn_off_message_logging: true
        drop_params: true
      general_settings:
        disable_spend_logs: true
        disable_error_logs: true
  # The object store has no port outside the pod, so its one identity is not a secret: these keys
  # are reachable only from inside the pod and grant nothing beyond it.
  object-store-identities:
    content: |
      {"identities": [{"name": "octryx",
        "credentials": [{"accessKey": "local-object-store", "secretKey": "local-object-store"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
  object-store-credentials:
    content: |
      [octryx-knowledge-object]
      aws_access_key_id = local-object-store
      aws_secret_access_key = local-object-store

services:
  # One-shot: generates the deployment secrets on the first start, keeps them afterwards.
  secrets-init:
    <<: *image
    restart: "no"
    network_mode: none
    user: "0:0"
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, secrets
        for name in ("jwt_secret", "encryption_key", "postgres_password", "litellm_master_key", "litellm_salt_key"):
            path = os.path.join("/run/octryx-secrets", name)
            if not os.path.exists(path):
                with open(path, "w") as handle:
                    # LiteLLM accepts a master key only with its "sk-" prefix.
                    handle.write(("sk-" if name == "litellm_master_key" else "") + secrets.token_hex(32))
            # The database password is read by the postgres user too. LiteLLM runs as root without capabilities, so
            # its keys belong to root and the platform reads them through its group; the rest only the platform reads.
            litellm = name.startswith("litellm_")
            os.chown(path, 0 if litellm else 10001, 10001)
            os.chmod(path, 0o444 if name == "postgres_password" else 0o440 if litellm else 0o400)
        os.chmod("/run/octryx-secrets", 0o755)
        # The server runners' join secret, alone in a volume of its own that only the api and the runners mount.
        join = "/run/octryx-runner/runner-join"
        if not os.path.exists(join):
            with open(join, "w") as handle:
                handle.write(secrets.token_hex(32))
        os.chown(join, 10001, 10001)
        os.chmod(join, 0o400)
    volumes:
      - secrets:/run/octryx-secrets
      - runner_join:/run/octryx-runner
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OCTRYX_POSTGRES_DB:-octryx}
      POSTGRES_USER: octryx
      POSTGRES_PASSWORD_FILE: /run/octryx-secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets:/run/octryx-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octryx -d ${OCTRYX_POSTGRES_DB:-octryx}"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  migrate:
    <<: [*image, *with-secrets]
    restart: "no"
    command: ["sh", "-c", "python -m app.services.model_gateway.bundled_litellm && python -m alembic upgrade head"]
    environment: *environment
    volumes:
      - secrets:/run/octryx-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Holds the network namespace the API and the object store share (like a Kubernetes pod), so the
  # object store is plain http on 127.0.0.1 and has no port of its own. Publishes the API port only.
  pod:
    image: registry.k8s.io/pause:3.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OCTRYX_PORT:-8000}:8000"

  api:
    <<: [*image, *with-secrets]
    restart: unless-stopped
    network_mode: "service:pod"
    command: ["python", "-m", "app.main"]
    environment: *environment
    # Declared here too: images built as OCI (Podman) carry no Dockerfile HEALTHCHECK.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s
    configs:
      - source: object-store-credentials
        target: /run/octryx-object-store/credentials
        mode: 0444
    volumes:
      - secrets:/run/octryx-secrets:ro
      - runner_join:/run/octryx-runner:ro
      - app_data:/app/data
      - app_uploads:/app/uploads
    depends_on:
      pod:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
      litellm:
        condition: service_healthy

  # The model gateway every model call goes through: on the pod's loopback only, so neither a runner nor the host
  # reaches it. The platform calls it with a virtual key it mints with the master key (bundled_litellm).
  litellm:
    image: ghcr.io/berriai/litellm:v1.82.0-stable@sha256:7acd2fdca2ab3b39024baff171fc7c743d63d9ff04ff6f9f01cf574f25f3a963
    restart: unless-stopped
    network_mode: "service:pod"
    # Root without any capability: LiteLLM writes its Prisma migrations into its own package folder at start.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        export LITELLM_MASTER_KEY="$$(cat /run/octryx-secrets/litellm_master_key)"
        export LITELLM_SALT_KEY="$$(cat /run/octryx-secrets/litellm_salt_key)"
        export DATABASE_URL="postgresql://octryx:$$(cat /run/octryx-secrets/postgres_password)@postgres:5432/litellm"
        exec litellm --config /etc/litellm/config.yaml --host 127.0.0.1 --port 4000
    environment:
      STORE_MODEL_IN_DB: "True"
      DISABLE_ADMIN_UI: "True"
      LITELLM_TELEMETRY: "False"
    configs:
      - source: litellm-config
        target: /etc/litellm/config.yaml
    volumes:
      - secrets:/run/octryx-secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    depends_on:
      pod:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  object-store:
    image: ghcr.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    network_mode: "service:pod"
    user: "1000:1000"
    command:
      - server
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.telemetry=false
      # Small volumes: a laptop install holds megabytes, not the 30 GB default per volume.
      - -master.volumeSizeLimitMB=256
      - -volume.max=16
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.autoCreateBucket=true
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: object-store-identities
        target: /etc/seaweedfs/s3.json
        mode: 0444
    volumes:
      - object_store_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 512m
    depends_on:
      pod:
        condition: service_started

  # ── Optional services (profiles) ──

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama

  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["llama-cpp"]
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_MODEL: ${LLAMA_CPP_MODEL_PATH:-/models/model.gguf}
      LLAMA_ARG_ALIAS: ${LLAMA_CPP_MODEL_ALIAS:-local-gguf}
      LLAMA_ARG_CTX_SIZE: ${LLAMA_CPP_CTX_SIZE:-8192}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_CPP_N_GPU_LAYERS:-0}
    volumes:
      - ./data/llama-cpp-models:/models

  code-indexer:
    <<: *with-secrets
    image: octryx-code-intel-worker:latest
    profiles: ["code-intelligence"]
    build:
      context: .
      dockerfile: Dockerfile
      target: code-intel-worker
      args:
        RUNTIME_BASE: java-toolchain
    command: ["python", "-m", "app.code_indexer_main"]
    environment:
      <<: *environment
      CODE_INDEXER_POLL_SECONDS: ${CODE_INDEXER_POLL_SECONDS:-60}
    volumes:
      - secrets:/run/octryx-secrets:ro
      - app_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The server runners' only way to the platform: the api's port through this proxy (docker/runner/gateway.conf.template).
  runner-gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    environment:
      OCTRYX_PUBLIC_HOST: localhost:${OCTRYX_PORT:-8000}
    volumes:
      - ./docker/runner/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [default, runners]
    depends_on:
      api:
        condition: service_healthy

  # Server runners (more with --scale runner=N): Codex sessions in a container of their own, on a network that
  # reaches nothing but the runner gateway. Codex runs under the agent's account (docker/runner/entry.sh).
  runner:
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    image: octryx-runner:local
    restart: unless-stopped
    # Docker refuses to start a runner whose runtime is not installed; it never falls back to another.
    runtime: ${RUNNER_RUNTIME:-runc}
    environment:
      OCTRYX_BASE_URL: http://runner-gateway:8000
      OCTRYX_RUNNER_RUNTIME: ${RUNNER_RUNTIME:-}
    volumes:
      - runner_join:/run/secrets/octryx:ro
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=2g
      - /workspace:exec,size=4g
      - /var/lib/octryx:exec,size=1g
    cap_drop: [ALL]
    # Root only sets up the writable places (entry.sh); the launcher keeps SETUID/SETGID, the agent nothing.
    cap_add: [CHOWN, FOWNER, FSETID, SETUID, SETGID]
    mem_limit: 4g
    pids_limit: 512
    networks: [runners]
    depends_on:
      runner-gateway:
        condition: service_started

networks:
  runners:
    internal: true

volumes:
  secrets:
  runner_join:
  postgres_data:
  app_data:
  app_uploads:
  object_store_data:
  ollama_data:
