<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/chat/static/chat/favicon.svg" />
    <link rel="stylesheet" href="/admin/static/chat/admin-design-tokens.css" />
    <title>{% block title %}Octryx{% endblock %}</title>
</head>
<body class="{{ body_class|default('') }} admin-design-shell">
    {% if user and not hide_top_nav %}
    <nav class="admin-topbar">
        <div class="admin-topbar__inner">
            <div class="admin-topbar__left">
                <a href="/admin" class="admin-topbar__brand">Octryx</a>
                <div class="admin-topbar__links">
                    <a href="/admin" class="admin-topbar__link admin-topbar__link--active">Dashboard</a>
                    <a href="/chat" class="admin-topbar__link">Chat</a>
                    <a href="/admin/calls" class="admin-topbar__link">Calls</a>
                    <a href="/admin/tools" class="admin-topbar__link">Tools</a>
                    <a href="/admin/settings" class="admin-topbar__link">Settings</a>
                    <a href="/chat?area=admin&amp;tab=providers" class="admin-topbar__link">Control Plane</a>
                    <a href="/admin/users" class="admin-topbar__link">Users</a>
                    <a href="/admin/projects" class="admin-topbar__link">Projects</a>
                    <a href="/admin/plugins" class="admin-topbar__link">Plugins</a>
                </div>
            </div>
            <div class="admin-topbar__actions">
                <span class="admin-topbar__user">{{ user.username }}</span>
                <a href="/chat/logout" class="admin-topbar__logout">Logout</a>
            </div>
        </div>
    </nav>
    {% endif %}
    <main class="admin-main {{ page_container_class|default('') }}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
