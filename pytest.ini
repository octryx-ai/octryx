[pytest]
testpaths = backend/tests
norecursedirs =
    .git
    .mypy_cache
    .pytest_cache
    .ruff_cache
    .tmp
    data
    frontend
    manager
    output
    uploads
    var
python_files = test_*.py
asyncio_mode = auto
pythonpath =
    .
    backend
markers =
    without_legacy_project_templates: run the test database without legacy project template fixtures
    committed_db: run the test against a committed DB baseline when background/concurrent sessions are required
    workflow_proposals: run with workflow proposals on (off in the suite by default; the product default is on)
    deferred_actions: run repository steps after the request as the product does (inline in the suite by default)
filterwarnings =
    ignore::DeprecationWarning
addopts =
    -n auto
    --maxprocesses=8
    --dist=loadfile
