{{- if .Values.metrics.serviceMonitor.enabled }}
{{- /* Prometheus Operator scrape of /metrics; the token is METRICS_SCRAPE_TOKEN of existingSecret. */ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "octryx.fullname" . }}-api
  labels:
    {{- include "octryx.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "octryx.selector" (dict "root" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials: {name: {{ include "octryx.secretName" . }}, key: METRICS_SCRAPE_TOKEN}
{{- end }}
