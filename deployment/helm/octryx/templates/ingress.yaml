{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "octryx.fullname" . }}
  labels: {{- include "octryx.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "host is required (the public hostname, without https://)" .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "octryx.fullname" . }}-api
                port: {name: http}
  tls:
    - hosts: [{{ .Values.host | quote }}]
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
{{- end }}
